name: Nightly E2E on DigitalOcean

on:
  schedule:
    # Run every night at 04:17 UTC (off-peak, avoids GitHub schedule herd)
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-e2e.txt

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.DO_SSH_PRIVATE_KEY }}" > ~/.ssh/amoeba-e2e
          chmod 600 ~/.ssh/amoeba-e2e

      - name: Run e2e on DigitalOcean
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DO_SSH_PRIVATE_KEY: /home/runner/.ssh/amoeba-e2e
          DO_SSH_PUBLIC_KEY: ${{ secrets.DO_SSH_PUBLIC_KEY }}
          AMOEBA_LOCAL_JWT_SECRET: ${{ secrets.AMOEBA_LOCAL_JWT_SECRET }}
          AMOEBA_AGE_SECRET_KEY: ${{ secrets.AMOEBA_AGE_SECRET_KEY }}
        run: python scripts/e2e-do.py
