name: Nightly E2E on DigitalOcean

on:
  schedule:
    # Run every night at 04:17 UTC (off-peak, avoids GitHub schedule herd)
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-e2e.txt

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.DO_SSH_PRIVATE_KEY }}" > ~/.ssh/amoeba-e2e
          chmod 600 ~/.ssh/amoeba-e2e

      - name: Run e2e on DigitalOcean
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DO_SSH_PRIVATE_KEY: /home/runner/.ssh/amoeba-e2e
          DO_SSH_PUBLIC_KEY: ${{ secrets.DO_SSH_PUBLIC_KEY }}
          AMOEBA_LOCAL_JWT_SECRET: ${{ secrets.AMOEBA_LOCAL_JWT_SECRET }}
          AMOEBA_AGE_SECRET_KEY: ${{ secrets.AMOEBA_AGE_SECRET_KEY }}
        run: python scripts/e2e-do.py --html=report.html --self-contained-html

      # Belt-and-braces cleanup: the e2e fixture destroys its droplet in teardown,
      # but that output is invisible on successful runs and a teardown failure
      # (network flake, runner kill) leaks a metered droplet. This sweep always
      # runs and deletes every droplet tagged amoeba-e2e, covering leaks from
      # previous failed runs too.
      - name: Sweep leftover e2e droplets
        if: always()
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys

          import requests

          API = "https://api.digitalocean.com/v2"
          headers = {"Authorization": f"Bearer {os.environ['DIGITALOCEAN_TOKEN']}"}

          try:
              url = f"{API}/droplets"
              droplets = []
              while url:
                  resp = requests.get(url, params={"tag_name": "amoeba-e2e"}, headers=headers, timeout=30)
                  resp.raise_for_status()
                  body = resp.json()
                  droplets.extend(body.get("droplets", []))
                  url = (body.get("links") or {}).get("pages", {}).get("next")
          except requests.RequestException as e:
              print(f"Could not list droplets, skipping sweep: {e}")
              sys.exit(0)

          if not droplets:
              print("No leftover e2e droplets")
              sys.exit(0)

          for d in droplets:
              try:
                  r = requests.delete(f"{API}/droplets/{d['id']}", headers=headers, timeout=30)
                  status = "deleted" if r.status_code == 204 else f"unexpected {r.status_code}: {r.text}"
              except requests.RequestException as e:
                  status = f"delete failed: {e}"
              print(f"Droplet {d['id']} ({d['name']}): {status}")
          PY

      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: report.html
          retention-days: 7

      - name: Upload cloud-init failure log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-init-failure-log
          path: e2e-cloud-init-failure.log
          if-no-files-found: ignore
          retention-days: 7
