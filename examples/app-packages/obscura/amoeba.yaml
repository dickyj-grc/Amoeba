api_version: v1
name: obscura
version: 1.0.0
description: Obscura headless browser (MCP server) for AI agents and web scraping.
app:
  type: compose
  compose_file: compose.yaml
placement:
  port: 3000
  cooldown_seconds: 180
permissions:
  # MCP's Streamable HTTP transport uses POST for every call (initialize,
  # tools/list, tools/call, ...), which Amoeba classifies as the "add"
  # operation -- read-only wouldn't be enough to call any MCP method at all.
  read: [admin, analyst, mcp:obscura]
  add: [admin, analyst, mcp:obscura]
# Obscura 0.2.3+ refuses to serve MCP over HTTP without a bearer token. The
# installer supplies one secret; the container gets it as OBSCURA_MCP_TOKEN
# and Amoeba sends it as `Authorization: Bearer ...` on every proxied call.
# Callers never see it: they authenticate to Amoeba with their own JWT.
upstream_auth:
  type: bearer_static
  secret: OBSCURA_MCP_TOKEN
schema:
  env: {}
  secrets:
    OBSCURA_MCP_TOKEN:
      description: Shared token between Amoeba and Obscura's MCP server (32+ characters).
      required: true
      validation_pattern: "^.{32,}$"
      inject: env
interface:
  type: mcp
  path: /mcp
  summary: MCP over HTTP at /mcp. Amoeba adds Obscura's own token; callers use their Amoeba token.
  try:
    method: POST
    path: /mcp
    body:
      jsonrpc: "2.0"
      id: 1
      method: tools/list
