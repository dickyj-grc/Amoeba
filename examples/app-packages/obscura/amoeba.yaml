api_version: v1
name: obscura
version: 1.0.0
description: Obscura headless browser (MCP server) for AI agents and web scraping.
app:
  type: compose
  compose_file: compose.yaml
placement:
  port: 3000
  cooldown_seconds: 180
permissions:
  # MCP's Streamable HTTP transport uses POST for every call (initialize,
  # tools/list, tools/call, ...), which Amoeba classifies as the "add"
  # operation -- read-only wouldn't be enough to call any MCP method at all.
  read: [admin, analyst]
  add: [admin, analyst]
# Obscura refuses a non-loopback MCP bind unless this token is set, and
# every MCP call must send it as Authorization: Bearer. The proxy attaches
# that header from the secret; the caller's Amoeba JWT is not forwarded.
upstream_auth:
  type: bearer_static
  token_secret: OBSCURA_MCP_TOKEN
schema:
  secrets:
    OBSCURA_MCP_TOKEN:
      description: Bearer token for Obscura's MCP HTTP server (at least 32 bytes)
      required: true
      inject: env
