services:
  streaming-echo:
    image: python:3.12-slim
    container_name: amoeba-streaming-echo
    environment:
      - MESSAGE=${MESSAGE}
    command:
      - sh
      - -c
      - |
        pip install --quiet flask && exec python - <<'PY'
        import os, time, json
        from flask import Flask, Response

        app = Flask(__name__)

        @app.route("/")
        def hello():
            msg = os.environ.get("MESSAGE", "hello from stream")
            return msg + "\n"

        @app.route("/stream")
        def stream():
            msg = os.environ.get("MESSAGE", "hello from stream")
            def events():
                for i in range(5):
                    yield f"data: {json.dumps({'index': i, 'message': msg})}\n\n"
                    time.sleep(0.5)
            return Response(events(), mimetype="text/event-stream")

        app.run(host="0.0.0.0", port=8080, threaded=True)
        PY
    ports:
      - "8080"
    networks:
      - amoeba-net

networks:
  amoeba-net:
    external: true
